<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Creator</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    body {
      background: #fafafa;
    }

    #mainscreen {
      min-height: calc(100vh - 48px);
    }

    .creator-form {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ddd;
      padding: 20px;
      box-sizing: border-box;
    }

    .creator-title {
      margin: 0 0 16px;
      font-size: 1.4rem;
    }

    .creator-field {
      margin-bottom: 16px;
    }

    .creator-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .creator-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    .creator-textarea {
      min-height: 100px;
    }

    .creator-inline {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .creator-inline .creator-control {
      flex: 1;
      min-width: 160px;
    }

    .creator-button {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .creator-button.primary {
      width: 100%;
      background: #333;
      color: #fff;
      margin-top: 8px;
    }

    .creator-button.secondary {
      background: #e4e4e4;
      color: #222;
    }

    .creator-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .creator-message {
      margin-top: 12px;
      font-weight: 600;
    }

    .message-success {
      color: #0a7a27;
    }

    .message-error {
      color: #b00020;
    }
  </style>
</head>
<body>
  <nav class="app-nav">
    <ul>
      <li><a href="/home">Home</a></li>
      <li><a href="/cardscreen">Flashcards</a></li>
      <li><a class="active" href="/creator">Card Creator</a></li>
      <li><a href="/manager">Card Manager</a></li>
    </ul>
  </nav>

  <main class="app-layout">
    <div id="mainscreen"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.0.5/p5.min.js"></script>
  <script src="scripts/CardCreatorSketch.js"></script>
</body>
</html>
